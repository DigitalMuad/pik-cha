services:
  - type: web
    name: pik-cha-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///../instance/pikcha.db
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
    plan: free

  - type: web
    name: pik-cha-frontend
    staticPublishPath: ./dist
    buildCommand: npm run build
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: pik-cha-backend
          type: web
          property: host
    plan: free
